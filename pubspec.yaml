name: passo_certo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  google_maps_flutter: ^2.5.3
  get_it: ^8.0.2
  go_router: ^10.1.2
  permission_handler: ^11.3.1
  equatable: ^2.0.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.9.0
  http: ^1.6.0
  geolocator: ^14.0.3
  flutter_tts: ^4.2.5
  hydrated_bloc: ^9.1.5
  path_provider: ^2.1.6
  flutter_typeahead: ^6.0.0
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  uuid: ^4.5.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
